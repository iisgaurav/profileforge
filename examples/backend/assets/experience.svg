<svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" role="img" viewBox="0 0 820 304"><title>Experience Widget</title><desc>ProfileForge Experience widget</desc><defs><linearGradient id="pf-progress-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58A6FF" stop-opacity=".75"/><stop offset="70%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#D2A8FF" stop-opacity=".9"/></linearGradient><linearGradient id="pf-card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#58A6FF" stop-opacity=".6"/><stop offset="60%" stop-color="#30363D" stop-opacity=".9"/><stop offset="100%" stop-color="#30363D" stop-opacity=".4"/></linearGradient><linearGradient id="pf-card-bg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="transparent" stop-opacity=".95"/><stop offset="100%" stop-color="transparent" stop-opacity=".8"/></linearGradient><linearGradient id="pf-card-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b0918"/><stop offset="50%" stop-color="#1e1333"/><stop offset="100%" stop-color="#091629"/></linearGradient><linearGradient id="pf-track-bg" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8B949E" stop-opacity=".15"/><stop offset="100%" stop-color="#8B949E" stop-opacity=".08"/></linearGradient><linearGradient id="pf-badge-0" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3B82F6" stop-opacity=".25"/><stop offset="100%" stop-color="#3B82F6" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10B981" stop-opacity=".25"/><stop offset="100%" stop-color="#10B981" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".25"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F59E0B" stop-opacity=".25"/><stop offset="100%" stop-color="#F59E0B" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-4" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EF4444" stop-opacity=".25"/><stop offset="100%" stop-color="#EF4444" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-5" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".25"/><stop offset="100%" stop-color="#06B6D4" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-6" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EC4899" stop-opacity=".25"/><stop offset="100%" stop-color="#EC4899" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-7" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#84CC16" stop-opacity=".25"/><stop offset="100%" stop-color="#84CC16" stop-opacity=".1"/></linearGradient></defs><svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" x="0" y="0" fill="none" role="group" viewBox="0 0 820 304"><title>Work Experience Card</title><desc>Card component for Work Experience</desc><rect width="819" height="303" x=".5" y=".5" fill="url(#pf-card-bg)" stroke="url(#pf-card-border)" stroke-width="1" rx="6"/><rect width="4" height="24" x="40" y="32" fill="#58A6FF" opacity=".9" rx="2"/><text x="56" y="49" fill="#C9D1D9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="40" x2="780" y1="72" y2="72" stroke="#58A6FF" stroke-opacity=".25" stroke-width=".5"/><text x="60" y="124" fill="#C9D1D9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Staff Backend Engineer · CloudScale Systems</text><text x="668" y="123" fill="#58A6FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2023 — Present</text><text x="60" y="140" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Leading the core distributed streaming platform processing over 2.5 million events per second.</text><text x="60" y="155" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Architected zero-copy Kafka ingestion pipeline reducing P99 latency by 58%.</text><text x="60" y="169" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Designed automated consensus reconciliation engine using Raft in Go.</text><text x="60" y="199" fill="#C9D1D9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Senior Systems Engineer · DataMesh Infrastructure</text><text x="688" y="198" fill="#58A6FF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2020 — 2023</text><text x="60" y="215" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Built high-reliability telemetry pipelines and distributed database clustering services.</text><text x="60" y="230" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Scaled multi-region PostgreSQL clusters with active-active logical replication.</text><text x="60" y="244" fill="#8B949E" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Implemented eBPF observability agent saving $350k/year in monitoring compute costs.</text></svg></svg>