t="0%" stop-color="#F59E0B" stop-opacity=".25"/><stop offset="100%" stop-color="#F59E0B" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-4" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EF4444" stop-opacity=".25"/><stop offset="100%" stop-color="#EF4444" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-5" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".25"/><stop offset="100%" stop-color="#06B6D4" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-6" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EC4899" stop-opacity=".25"/><stop offset="100%" stop-color="#EC4899" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-7" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#84CC16" stop-opacity=".25"/><stop offset="100%" stop-color="#84CC16" stop-opacity=".1"/></linearGradient></defs><svg xmlns="http://www.w3.org/2000/svg" width="820" height="246" x="0" y="0" fill="none" role="group" viewBox="0 0 820 246"><title>Work Experience Card</title><desc>Card component for Work Experience</desc><rect width="819" height="245" x=".5" y=".5" fill="url(#pf-card-bg)" stroke="url(#pf-card-border)" stroke-width="1" rx="6"/><rect width="3" height="20" x="20" y="16" fill="#88C0D0" opacity=".9" rx="1.5"/><text x="32" y="31" fill="#ECEFF4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="20" x2="800" y1="44" y2="44" stroke="#88C0D0" stroke-opacity=".25" stroke-width=".5"/><text x="20" y="86" fill="#ECEFF4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="668" y="85" fill="#88C0D0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2023 — Present</text><text x="20" y="102" fill="#D8DEE9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="20" y="117" fill="#D8DEE9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="20" y="131" fill="#D8DEE9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><text x="20" y="161" fill="#ECEFF4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="688" y="160" fill="#88C0D0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2020 — 2023</text><text x="20" y="177" fill="#D8DEE9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="20" y="192" fill="#D8DEE9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="20" y="206" fill="#D8DEE9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></svg></svg>