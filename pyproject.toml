[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "profileforge"
version = "1.0.0"
authors = [
  { name="Gaurav Verma", email="gauravv2504@gmail.com" },
]
description = "The Open-Source GitHub Profile Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["github", "profile", "svg", "widgets", "readme", "stats", "themes"]

dependencies = [
    "PyYAML>=6.0",
]



[project.urls]
Homepage = "https://github.com/iisgaurav/profileforge"
Documentation = "https://github.com/iisgaurav/profileforge/tree/main/docs"
Repository = "https://github.com/iisgaurav/profileforge"
Issues = "https://github.com/iisgaurav/profileforge/issues"

[tool.setuptools.package-data]
profileforge = [
    "themes/*.yaml",
    "templates/*/*.yaml",
    "templates/*/*.md",
    "templates/*/config/*.yaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.3.0",
    "cairosvg>=2.7.1",
    "pillow>=10.0.0",
    "watchdog>=4.0.0"
]
rendering = [
    "pycairo>=1.26",
]
github = [
    "httpx>=0.28"
]

[project.scripts]
profileforge = "profileforge.cli.main:main"

[tool.black]
target-version = ['py39']
line-length = 88

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
