inearGradient id="pf-track-bg" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#a6adc8" stop-opacity=".15"/><stop offset="100%" stop-color="#a6adc8" stop-opacity=".08"/></linearGradient><linearGradient id="pf-badge-0" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3B82F6" stop-opacity=".25"/><stop offset="100%" stop-color="#3B82F6" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10B981" stop-opacity=".25"/><stop offset="100%" stop-color="#10B981" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".25"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F59E0B" stop-opacity=".25"/><stop offset="100%" stop-color="#F59E0B" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-4" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EF4444" stop-opacity=".25"/><stop offset="100%" stop-color="#EF4444" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-5" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".25"/><stop offset="100%" stop-color="#06B6D4" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-6" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EC4899" stop-opacity=".25"/><stop offset="100%" stop-color="#EC4899" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-7" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#84CC16" stop-opacity=".25"/><stop offset="100%" stop-color="#84CC16" stop-opacity=".1"/></linearGradient></defs><g data-pf-id="card_f27be4" role="group"><rect width="819" height="331" x=".5" y=".5" fill="url(#pf-card-bg)" stroke="url(#pf-card-border)" stroke-width="1" rx="16"/><rect width="4" height="20" x="24" y="24" fill="#89b4fa" opacity=".9" rx="2"/><text x="36" y="40" fill="#cdd6f4" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#89b4fa" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_261e45"><g data-pf-id="inline_901155"><text x="24" y="78" fill="#cdd6f4" data-pf-id="text_ab8504" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#89b4fa" data-pf-id="text_01775f" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#a6adc8" data-pf-id="text_3c645e" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#a6adc8" data-pf-id="text_e2aeca" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#a6adc8" data-pf-id="text_17fa04" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_5f20e3"><text x="24" y="208" fill="#cdd6f4" data-pf-id="text_84d071" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#89b4fa" data-pf-id="text_269453" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#a6adc8" data-pf-id="text_8d33a8" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#a6adc8" data-pf-id="text_d9baad" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#a6adc8" data-pf-id="text_c087a0" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>