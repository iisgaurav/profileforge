    <g data-pf-id="column_b72537"><g data-pf-id="inline_1bb9a8"><text x="24" y="78" font-family="Roboto, sans-serif" font-size="14" font-weight="700" fill="#E0E0E0"  data-pf-id="text_82462c">Staff Software Engineer · CloudScale Infrastructure</text><text x="691.0" y="77.0" font-family="Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFD700"  data-pf-id="text_5c0fee">2023 — Present</text></g>
<text x="24" y="110" font-family="Roboto, sans-serif" font-size="12" font-weight="normal" fill="#757575"  data-pf-id="text_04cb70">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>
<text x="24" y="142" font-family="Roboto, sans-serif" font-size="12" font-weight="normal" fill="#757575"  data-pf-id="text_971d60">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text>
<text x="24" y="174" font-family="Roboto, sans-serif" font-size="12" font-weight="normal" fill="#757575"  data-pf-id="text_5a0b3b">▸ Mentored team of 12 engineers across systems engineering.</text>
<g data-pf-id="inline_6914cd"><text x="24" y="208" font-family="Roboto, sans-serif" font-size="14" font-weight="700" fill="#E0E0E0"  data-pf-id="text_44765f">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714.0" y="207.0" font-family="Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFD700"  data-pf-id="text_c42632">2020 — 2023</text></g>
<text x="24" y="240" font-family="Roboto, sans-serif" font-size="12" font-weight="normal" fill="#757575"  data-pf-id="text_3f2f2f">Architected modern web micro-frontends and robust asynchronous Python backends.</text>
<text x="24" y="272" font-family="Roboto, sans-serif" font-size="12" font-weight="normal" fill="#757575"  data-pf-id="text_b3ffe9">▸ Reduced end-to-end latency by 45% using efficient caching.</text>
<text x="24" y="304" font-family="Roboto, sans-serif" font-size="12" font-weight="normal" fill="#757575"  data-pf-id="text_318e21">▸ Created automated CI/CD pipeline reducing deployment time.</text></g>
