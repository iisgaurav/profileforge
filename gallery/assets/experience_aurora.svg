    <g data-pf-id="column_1394de"><g data-pf-id="inline_e54abb"><text x="24" y="78" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#D6DEEB"  data-pf-id="text_1c3bd6">Staff Software Engineer · CloudScale Infrastructure</text><text x="691.0" y="77.0" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#22E892"  data-pf-id="text_66596a">2023 — Present</text></g>
<text x="24" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#5F7E97"  data-pf-id="text_d1973f">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>
<text x="24" y="142" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#5F7E97"  data-pf-id="text_bbda77">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text>
<text x="24" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#5F7E97"  data-pf-id="text_979504">▸ Mentored team of 12 engineers across systems engineering.</text>
<g data-pf-id="inline_8bbf95"><text x="24" y="208" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#D6DEEB"  data-pf-id="text_a7260e">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714.0" y="207.0" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#22E892"  data-pf-id="text_b29bc0">2020 — 2023</text></g>
<text x="24" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#5F7E97"  data-pf-id="text_8e0c71">Architected modern web micro-frontends and robust asynchronous Python backends.</text>
<text x="24" y="272" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#5F7E97"  data-pf-id="text_50d37c">▸ Reduced end-to-end latency by 45% using efficient caching.</text>
<text x="24" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#5F7E97"  data-pf-id="text_939cf2">▸ Created automated CI/CD pipeline reducing deployment time.</text></g>
