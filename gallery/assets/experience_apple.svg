<text x="24" y="184" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="normal" fill="#86868B">▸ Reduced end-to-end latency by 45% using efficient caching.</text>

<text x="24" y="198" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="normal" fill="#86868B">▸ Created automated CI/CD pipeline reducing deployment time.</text>
