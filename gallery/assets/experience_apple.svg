    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700" fill="#1D1D1F">Staff Software Engineer · CloudScale Infrastructure</text>
<text x="704" y="77" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#0071E3">2023 — Present</text>

<text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="normal" fill="#86868B">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>

<text x="24" y="109" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="normal" fill="#86868B">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text>

<text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="normal" fill="#86868B">▸ Mentored team of 12 engineers across systems engineering.</text>


