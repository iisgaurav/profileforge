<text x="24" y="110" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#8B949E"  data-pf-id="text_83e1e0">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>
<text x="24" y="142" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#8B949E"  data-pf-id="text_c4b0fa">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text>
<text x="24" y="174" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#8B949E"  data-pf-id="text_14435e">▸ Mentored team of 12 engineers across systems engineering.</text>
<g data-pf-id="inline_547548"><text x="24" y="208" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#C9D1D9"  data-pf-id="text_52557f">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714.0" y="207.0" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#58A6FF"  data-pf-id="text_5e95f4">2020 — 2023</text></g>
<text x="24" y="240" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#8B949E"  data-pf-id="text_775af3">Architected modern web micro-frontends and robust asynchronous Python backends.</text>
<text x="24" y="272" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#8B949E"  data-pf-id="text_4760d4">▸ Reduced end-to-end latency by 45% using efficient caching.</text>
<text x="24" y="304" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#8B949E"  data-pf-id="text_df1daf">▸ Created automated CI/CD pipeline reducing deployment time.</text></g>
