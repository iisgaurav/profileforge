<text x="688" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#58A6FF">2023 — Present</text>

<text x="40" y="102" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B949E">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>

<text x="40" y="117" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B949E">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text>

<text x="40" y="131" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B949E">▸ Mentored team of 12 engineers across systems engineering.</text>


<text x="40" y="161" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#C9D1D9">Senior Full-Stack Engineer · Nexus Technologies</text>
<text x="708" y="160" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#58A6FF">2020 — 2023</text>

<text x="40" y="177" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B949E">Architected modern web micro-frontends and robust asynchronous Python backends.</text>

<text x="40" y="192" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B949E">▸ Reduced end-to-end latency by 45% using efficient caching.</text>

<text x="40" y="206" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8B949E">▸ Created automated CI/CD pipeline reducing deployment time.</text>
