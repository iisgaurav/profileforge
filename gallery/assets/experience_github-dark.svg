f-card-border)" stroke-width="1" rx="6"/><rect width="4" height="20" x="24" y="24" fill="#58A6FF" opacity=".9" rx="2"/><text x="36" y="40" fill="#C9D1D9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#58A6FF" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_481db8"><g data-pf-id="inline_9c3fa8"><text x="24" y="78" fill="#C9D1D9" data-pf-id="text_b5f096" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#58A6FF" data-pf-id="text_01f02d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#8B949E" data-pf-id="text_d780b4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#8B949E" data-pf-id="text_aeb72b" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#8B949E" data-pf-id="text_e16177" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_271b5c"><text x="24" y="208" fill="#C9D1D9" data-pf-id="text_7769cc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#58A6FF" data-pf-id="text_20da93" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#8B949E" data-pf-id="text_cdb804" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#8B949E" data-pf-id="text_bf4228" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#8B949E" data-pf-id="text_18e4d3" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>