ct width="4" height="20" x="24" y="24" fill="#3B82F6" opacity=".9" rx="2"/><text x="36" y="40" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#3B82F6" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_0be173"><g data-pf-id="inline_294c38"><text x="24" y="78" fill="#F8FAFC" data-pf-id="text_174aa2" font-family="Inter, sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#3B82F6" data-pf-id="text_ff11fe" font-family="Inter, sans-serif" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#94A3B8" data-pf-id="text_3cdd8e" font-family="Inter, sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#94A3B8" data-pf-id="text_1bbdfa" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#94A3B8" data-pf-id="text_caf6bf" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_05086a"><text x="24" y="208" fill="#F8FAFC" data-pf-id="text_fd6ac2" font-family="Inter, sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#3B82F6" data-pf-id="text_ba66b9" font-family="Inter, sans-serif" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#94A3B8" data-pf-id="text_5988c5" font-family="Inter, sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#94A3B8" data-pf-id="text_e9b01c" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#94A3B8" data-pf-id="text_0c4a9f" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>