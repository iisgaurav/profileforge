<svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" role="img" viewBox="0 0 820 304"><title>experience - minimal</title><desc>ProfileForge widget preview</desc><defs><linearGradient id="pf-progress-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#000" stop-opacity=".75"/><stop offset="70%" stop-color="#000"/><stop offset="100%" stop-color="#F05" stop-opacity=".9"/></linearGradient><linearGradient id="pf-card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#000" stop-opacity=".6"/><stop offset="60%" stop-color="#EEE" stop-opacity=".9"/><stop offset="100%" stop-color="#EEE" stop-opacity=".4"/></linearGradient><linearGradient id="pf-card-bg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F9F9F9" stop-opacity=".95"/><stop offset="100%" stop-color="#F9F9F9" stop-opacity=".8"/></linearGradient><linearGradient id="pf-card-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b0918"/><stop offset="50%" stop-color="#1e1333"/><stop offset="100%" stop-color="#091629"/></linearGradient><linearGradient id="pf-track-bg" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#888" stop-opacity=".15"/><stop offset="100%" stop-color="#888" stop-opacity=".08"/></linearGradient><linearGradient id="pf-badge-0" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3B82F6" stop-opacity=".25"/><stop offset="100%" stop-color="#3B82F6" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10B981" stop-opacity=".25"/><stop offset="100%" stop-color="#10B981" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity=".25"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#F59E0B" stop-opacity=".25"/><stop offset="100%" stop-color="#F59E0B" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-4" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EF4444" stop-opacity=".25"/><stop offset="100%" stop-color="#EF4444" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-5" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06B6D4" stop-opacity=".25"/><stop offset="100%" stop-color="#06B6D4" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-6" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#EC4899" stop-opacity=".25"/><stop offset="100%" stop-color="#EC4899" stop-opacity=".1"/></linearGradient><linearGradient id="pf-badge-7" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#84CC16" stop-opacity=".25"/><stop offset="100%" stop-color="#84CC16" stop-opacity=".1"/></linearGradient></defs><svg xmlns="http://www.w3.org/2000/svg" width="820" height="304" x="0" y="0" fill="none" role="group" viewBox="0 0 820 304"><title>Work Experience Card</title><desc>Card component for Work Experience</desc><rect width="819" height="303" x=".5" y=".5" fill="url(#pf-card-bg)" stroke="url(#pf-card-border)" stroke-width="1" rx="4"/><rect width="4" height="24" x="40" y="32" fill="#000" opacity=".9" rx="2"/><text x="56" y="49" fill="#111" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="40" x2="780" y1="72" y2="72" stroke="#000" stroke-opacity=".25" stroke-width=".5"/><text x="60" y="124" fill="#111" font-family="sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="668" y="123" fill="#000" font-family="sans-serif" font-size="12" font-weight="600">2023 — Present</text><text x="60" y="140" fill="#888" font-family="sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="60" y="155" fill="#888" font-family="sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="60" y="169" fill="#888" font-family="sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><text x="60" y="199" fill="#111" font-family="sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="688" y="198" fill="#000" font-family="sans-serif" font-size="12" font-weight="600">2020 — 2023</text><text x="60" y="215" fill="#888" font-family="sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="60" y="230" fill="#888" font-family="sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="60" y="244" fill="#888" font-family="sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></svg></svg>