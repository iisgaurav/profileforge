city=".9" rx="2"/><text x="36" y="40" fill="#111" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#000" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_fadc2b"><g data-pf-id="inline_aef121"><text x="24" y="78" fill="#111" data-pf-id="text_8849e8" font-family="sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#000" data-pf-id="text_e75139" font-family="sans-serif" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#888" data-pf-id="text_2e2a11" font-family="sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#888" data-pf-id="text_dea0fa" font-family="sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#888" data-pf-id="text_f6f8e7" font-family="sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_950c2d"><text x="24" y="208" fill="#111" data-pf-id="text_1ddb68" font-family="sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#000" data-pf-id="text_f74d34" font-family="sans-serif" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#888" data-pf-id="text_122e2e" font-family="sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#888" data-pf-id="text_803928" font-family="sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#888" data-pf-id="text_eb4fa8" font-family="sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>