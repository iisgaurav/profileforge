Gradient id="pf-badge-7" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#84CC16" stop-opacity=".25"/><stop offset="100%" stop-color="#84CC16" stop-opacity=".1"/></linearGradient></defs><g data-pf-id="card_30b2c9" role="group"><rect width="819" height="331" x=".5" y=".5" fill="url(#pf-card-bg)" stroke="url(#pf-card-border)" stroke-width="1" rx="0"/><rect width="4" height="20" x="24" y="24" fill="#00F0FF" opacity=".9" rx="2"/><text x="36" y="40" fill="#E0E0FF" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#00F0FF" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_10446b"><g data-pf-id="inline_872479"><text x="24" y="78" fill="#E0E0FF" data-pf-id="text_c5b076" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#00F0FF" data-pf-id="text_5b9709" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#7A7A99" data-pf-id="text_85c24f" font-family="JetBrains Mono, monospace" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#7A7A99" data-pf-id="text_0534e8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#7A7A99" data-pf-id="text_a3cb47" font-family="JetBrains Mono, monospace" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_b8b297"><text x="24" y="208" fill="#E0E0FF" data-pf-id="text_13a8be" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#00F0FF" data-pf-id="text_54da22" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#7A7A99" data-pf-id="text_daa0b3" font-family="JetBrains Mono, monospace" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#7A7A99" data-pf-id="text_9618dc" font-family="JetBrains Mono, monospace" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#7A7A99" data-pf-id="text_b565a3" font-family="JetBrains Mono, monospace" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>