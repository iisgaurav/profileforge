width="4" height="20" x="24" y="24" fill="#88C0D0" opacity=".9" rx="2"/><text x="36" y="40" fill="#ECEFF4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#88C0D0" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_e14fc0"><g data-pf-id="inline_71f4e6"><text x="24" y="78" fill="#ECEFF4" data-pf-id="text_245995" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#88C0D0" data-pf-id="text_163467" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#D8DEE9" data-pf-id="text_230dd7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#D8DEE9" data-pf-id="text_09d1f2" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#D8DEE9" data-pf-id="text_b19eec" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_3eb7c3"><text x="24" y="208" fill="#ECEFF4" data-pf-id="text_ba747d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#88C0D0" data-pf-id="text_0c1e6a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#D8DEE9" data-pf-id="text_36bc0a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#D8DEE9" data-pf-id="text_fc14fd" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#D8DEE9" data-pf-id="text_99c99a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>