<text x="44" y="204" font-family="Inter, 'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="normal" fill="#A1A1AA">▸ Reduced end-to-end latency by 45% using efficient caching.</text>

<text x="44" y="218" font-family="Inter, 'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="normal" fill="#A1A1AA">▸ Created automated CI/CD pipeline reducing deployment time.</text>
