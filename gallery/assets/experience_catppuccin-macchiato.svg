<text x="24" y="240" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#a5adcb"  data-pf-id="text_05b18a">Architected modern web micro-frontends and robust asynchronous Python backends.</text>
