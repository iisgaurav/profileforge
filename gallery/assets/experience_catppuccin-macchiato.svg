<text x="24" y="110" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal" fill="#a5adcb"  data-pf-id="text_73bfce">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>
