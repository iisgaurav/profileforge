" rx="16"/><rect width="4" height="20" x="24" y="24" fill="#8aadf4" opacity=".9" rx="2"/><text x="36" y="40" fill="#cad3f5" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#8aadf4" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_24f9c6"><g data-pf-id="inline_dbe26f"><text x="24" y="78" fill="#cad3f5" data-pf-id="text_f1a9f5" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#8aadf4" data-pf-id="text_bb6e21" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#a5adcb" data-pf-id="text_b026a1" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#a5adcb" data-pf-id="text_bef385" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#a5adcb" data-pf-id="text_4d9ba1" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_2e9051"><text x="24" y="208" fill="#cad3f5" data-pf-id="text_44a755" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#8aadf4" data-pf-id="text_df21c9" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#a5adcb" data-pf-id="text_1c3b1c" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#a5adcb" data-pf-id="text_f43066" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#a5adcb" data-pf-id="text_711276" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>