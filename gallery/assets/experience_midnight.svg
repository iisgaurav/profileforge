x="2"/><text x="36" y="40" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="24" font-weight="700" letter-spacing=".3">Work Experience</text><line x1="24" x2="796" y1="60" y2="60" stroke="#FFF" stroke-opacity=".25" stroke-width=".5"/><g data-pf-id="column_5a3b13"><g data-pf-id="inline_f4cf50"><text x="24" y="78" fill="#FAFAFA" data-pf-id="text_0de13d" font-family="Inter, sans-serif" font-size="14" font-weight="700">Staff Software Engineer · CloudScale Infrastructure</text><text x="691" y="77" fill="#FFF" data-pf-id="text_d44b28" font-family="Inter, sans-serif" font-size="12" font-weight="600">2023 — Present</text></g><text x="24" y="110" fill="#666" data-pf-id="text_0a4b17" font-family="Inter, sans-serif" font-size="12" font-weight="normal">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text><text x="24" y="142" fill="#666" data-pf-id="text_b24b13" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text><text x="24" y="174" fill="#666" data-pf-id="text_7c37eb" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Mentored team of 12 engineers across systems engineering.</text><g data-pf-id="inline_5ae14e"><text x="24" y="208" fill="#FAFAFA" data-pf-id="text_e6474e" font-family="Inter, sans-serif" font-size="14" font-weight="700">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714" y="207" fill="#FFF" data-pf-id="text_f65141" font-family="Inter, sans-serif" font-size="12" font-weight="600">2020 — 2023</text></g><text x="24" y="240" fill="#666" data-pf-id="text_68854a" font-family="Inter, sans-serif" font-size="12" font-weight="normal">Architected modern web micro-frontends and robust asynchronous Python backends.</text><text x="24" y="272" fill="#666" data-pf-id="text_6ddb74" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Reduced end-to-end latency by 45% using efficient caching.</text><text x="24" y="304" fill="#666" data-pf-id="text_d492c4" font-family="Inter, sans-serif" font-size="12" font-weight="normal">▸ Created automated CI/CD pipeline reducing deployment time.</text></g></g></svg></svg>