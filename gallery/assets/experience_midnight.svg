    <g data-pf-id="column_5a3b13"><g data-pf-id="inline_f4cf50"><text x="24" y="78" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FAFAFA"  data-pf-id="text_0de13d">Staff Software Engineer · CloudScale Infrastructure</text><text x="691.0" y="77.0" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF"  data-pf-id="text_d44b28">2023 — Present</text></g>
<text x="24" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#666666"  data-pf-id="text_0a4b17">Leading architecture for distributed telemetry and real-time event ingestion pipelines.</text>
<text x="24" y="142" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#666666"  data-pf-id="text_b24b13">▸ Scaled high-throughput stream processing to 1M+ req/sec.</text>
<text x="24" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#666666"  data-pf-id="text_7c37eb">▸ Mentored team of 12 engineers across systems engineering.</text>
<g data-pf-id="inline_5ae14e"><text x="24" y="208" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FAFAFA"  data-pf-id="text_e6474e">Senior Full-Stack Engineer · Nexus Technologies</text><text x="714.0" y="207.0" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF"  data-pf-id="text_f65141">2020 — 2023</text></g>
<text x="24" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#666666"  data-pf-id="text_68854a">Architected modern web micro-frontends and robust asynchronous Python backends.</text>
<text x="24" y="272" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#666666"  data-pf-id="text_6ddb74">▸ Reduced end-to-end latency by 45% using efficient caching.</text>
<text x="24" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="normal" fill="#666666"  data-pf-id="text_d492c4">▸ Created automated CI/CD pipeline reducing deployment time.</text></g>
