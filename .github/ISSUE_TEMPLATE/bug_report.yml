name: "🐛 Bug Report"
description: "Report a reproducible bug or unexpected behavior in ProfileForge"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: dropdown
    id: layer
    attributes:
      label: "Affected Architectural Layer"
      description: "Select the architectural layer where the issue occurs"
      options:
        - "Layer 1: Core / Models"
        - "Layer 2: Themes"
        - "Layer 3: Components"
        - "Layer 4: Layout"
        - "Layer 5: Render / SVG"
        - "Layer 6: Connectors"
        - "Layer 7: Widgets"
        - "Layer 8: CLI / Application"
        - "Unknown / Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running 'profileforge build', widget X fails with..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Create profileforge.yaml with widget '...'
        2. Set active theme to '...'
        3. Run 'profileforge build'
        4. See error output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Log Output / Traceback"
      description: "Paste relevant CLI logs or error tracebacks."
      render: shell
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS version, Python version, and ProfileForge version"
      placeholder: "Windows 11 / Ubuntu 22.04 | Python 3.12.2 | ProfileForge 1.0.0"
    validations:
      required: true
