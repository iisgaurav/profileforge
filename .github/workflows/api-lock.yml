name: ProfileForge API Lock Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-lock:
    name: Verify Public API Surface Lock
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Verify API Lock Snapshot
      run: python tools/api_lock.py --check
