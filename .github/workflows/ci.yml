name: ProfileForge CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Format Check (Ruff)
      run: ruff format --check src/ tests/ tools/
      
    - name: Lint (Ruff)
      run: ruff check src/ tests/ tools/

    - name: Verify Public API Lock Snapshot
      run: python tools/api_lock.py --check
      
    - name: Run Test Suite (pytest)
      run: pytest tests/ -v
      
    - name: Verify Performance & SLA Budget Gate
      run: python tools/performance_check.py

    - name: Verify ADR Index & Integrity
      run: python tools/adr_index.py --check

    - name: Verify Documentation QA & Link Integrity
      run: python tools/docs_check.py

    - name: Full Release Pre-Flight Check
      run: python tools/release.py check
      
    - name: Verify All Starter Template Builds
      run: |
        profileforge build --config examples/backend/profileforge.yaml
        profileforge build --config examples/frontend/profileforge.yaml
        profileforge build --config examples/minimal/profileforge.yaml
        profileforge build --config examples/student/profileforge.yaml
        profileforge build --config examples/opensource/profileforge.yaml
        profileforge build --config examples/ai-engineer/profileforge.yaml

    - name: Install Cairo (Ubuntu Only)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get install -y libcairo2-dev

    - name: Run Visual QA Regression Pipeline
      run: python tools/visual_qa.py --require-qa

    - name: Upload Visual QA Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: profileforge-visual-artifacts
        path: artifacts/
        retention-days: 14
